<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
  <defs>
    <linearGradient id="fsheenewma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b88cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b88cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b88cff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fclipewma"><rect width="1000" height="250" rx="16"/></clipPath>
    <style><![CDATA[
      .fswewma{animation:fswpewma 6s linear infinite}
      @keyframes fswpewma{from{transform:translateX(-320px)}to{transform:translateX(1000px)}}
    ]]></style>
  </defs>
  <rect width="1000" height="250" rx="16" fill="#0d1222"/>
  <g clip-path="url(#fclipewma)"><rect class="fswewma" x="0" y="0" width="300" height="250" fill="url(#fsheenewma)"/></g>
  <rect x="0" y="14" width="6" height="222" rx="3" fill="#b88cff" opacity=".75">
    <animate attributeName="opacity" values=".4;.9;.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="250" rx="16" fill="none" stroke="#b88cff" stroke-opacity=".35"/>
  <text x="44" y="42" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#6c7aa0">EWMA · UE_MODULE.UPD_DL_THROUGHPUT_BPS :629</text>
  <text x="44" y="80" font-family="'Cambria Math', Georgia, serif" font-size="24" fill="#e8eeff">r(t) = bits · 1000 / Δt<tspan baseline-shift="sub" font-size="18">ms</tspan>     (current_dl_throughput, бит/с)</text><text x="44" y="128" font-family="'Cambria Math', Georgia, serif" font-size="24" fill="#e8eeff">R(t) = (1 − α) · R(t−1) + α · r(t)     (average_throughput)</text><text x="44" y="176" font-family="'Cambria Math', Georgia, serif" font-size="24" fill="#e8eeff">α = 0.002 — хардкод, TODO вынести в конфиг симуляции</text>
</svg>