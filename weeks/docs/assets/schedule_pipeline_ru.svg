<rect x="70" y="75" width="320" height="105" rx="16" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="230.0" y="117" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">1. Обновление CQI</text><text x="230.0" y="148" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">_refresh_cqi()</text><line x1="390" y1="127" x2="430" y2="127" stroke="#e6ecff" stroke-width="2" marker-end="url(#arrow)"/><rect x="460" y="75" width="320" height="105" rx="16" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="620.0" y="117" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">2. Отбор UE</text><text x="620.0" y="148" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">_filter_eligible_ues()</text><line x1="780" y1="127" x2="820" y2="127" stroke="#e6ecff" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="75" width="320" height="105" rx="16" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="1010.0" y="117" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">3. Окно UE</text><text x="1010.0" y="148" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">_update_active_window()</text><line x1="1010" y1="180" x2="1010" y2="220" stroke="#e6ecff" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="240" width="320" height="105" rx="16" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="230.0" y="282" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">4. Приоритеты</text><text x="230.0" y="313" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">_calculate_priorities()</text><line x1="390" y1="292" x2="430" y2="292" stroke="#e6ecff" stroke-width="2" marker-end="url(#arrow)"/><rect x="460" y=