ht="105" rx="16" fill="#151c31" stroke="#7de3b2" stroke-width="2"/><text x="1010.0" y="447" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">9. Буфер + статистика</text><text x="1010.0" y="478" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">_process_buffers()</text><text x="70" y="575" fill="#9aa9c8" font-family="DejaVu Sans" font-size="20px" font-weight="400" text-anchor="start">Каждый TTI проходит эти этапы последовательно. Состояние CQIMap и Round Robin сохраняется.</text></svg>