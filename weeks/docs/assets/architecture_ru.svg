<rect width="1200" height="650" fill="url(#grid)"/>

<rect x="55" y="70" width="245" height="105" rx="18" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="177.5" y="112" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">Состояние UE</text><text x="177.5" y="143" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">CQI • buffer • UE_ID</text><rect x="345" y="70" width="275" height="105" rx="18" fill="#151c31" stroke="#b88cff" stroke-width="2"/><text x="482.5" y="112" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">SchedulerInterface</text><text x="482.5" y="143" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">schedule(tti, users)</text><rect x="675" y="70" width="230" height="105" rx="18" fill="#151c31" stroke="#7de3b2" stroke-width="2"/><text x="790.0" y="112" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">Выбор алгоритма</text><text x="790.0" y="143" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">RR • Best CQI • PF • FD</text><rect x="960" y="70" width="180" height="105" rx="18" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="1050.0" y="112" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">LTE Grid</text><text x="1050.0" y="143" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">ALLOCATE_RBG()</text><rect x="80" y="290" width="250" height="105" rx="18" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="205.0" y="332" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">CQIMap</text><text x="205.0" y="363" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">WB / SB + время</text><rect x="375" y="290" width="250" height="105" rx="18" fill="#151c31" stroke="#ffb86b" stroke-width="2"/><text x="500.0" y="332" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">PDCCHManager</text><text x="500.0" y="363" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">CCE + aggregation</text><rect x="670" y="290" width="230" height="105" rx="18" fill="#151c31" stroke="#b88cff" stroke-width="2"/><text x="785.0" y="332" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">AMC</text><text x="785.0" y="363" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">GET_BITS_PER_RB()</text><rect x="945" y="290" width="195" height="105" rx="18" fill="#151c31" stroke="#7de3b2" stroke-width="2"/><text x="1042.5" y="332" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">Буфер</text><text x="1042.5" y="363" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">_process_buffers()</text><line x1="300" y1="122" x2="345" y2="122" stroke="#4edcff" stroke-width="3" marker-end="url(#arrow)"/><line x1="620" y1="122" x2="675" y2="122" stroke="#b88cff" stroke-width="3" marker-end="url(#arrow)"/><line x1="905" y1="122" x2="960" y2="122" stroke="#7de3b2" stroke-width="3" marker-end="url(#arrow)"/><line x1="205" y1="290" x2="205" y2="175" stroke="#4edcff" stroke-width="3" marker-end="url(#arrow)"/><line x1="500" y1="290" x2="500" y2="175" stroke="#ffb86b" stroke-width="3" marker-end="url(#arrow)"/><line x1="785" y1="290" x2="785" y2="175" stroke="#b88cff" stroke-width="3" marker-end="url(#arrow)"/><line x1="1050" y1="175" x2="1050" y2="290" stroke="#7de3b2" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="465" fill="#9aa9c8" font-family="DejaVu Sans" font-size="20px" font-weight="400" text-anchor="start">Верхняя цепочка показывает путь принятия решения внутри одного TTI.</text><text x="70" y="500" fill="#9aa9c8" font-family="DejaVu Sans" font-size="20px" font-weight="400" text-anchor="start">CQIMap и PDCCHManager подают данные в scheduler; AMC и буфер участвуют на этапе передачи.</text><text x="70" y="535" fill="#9aa9c8" font-family="DejaVu Sans" font-size="20px" font-weight="400" text-anchor="start">Конкретный scheduler меняет расчёт приоритетов и распределение RBG.</text></svg>