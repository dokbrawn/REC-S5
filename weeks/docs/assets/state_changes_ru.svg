<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="850" viewBox="0 0 1560 850">
  <defs><marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#6c7aa0"/></marker></defs>
  <rect width="1560" height="850" rx="20" fill="#0d1222"/>
  <rect width="1560" height="850" rx="20" fill="none" stroke="#b88cff" stroke-opacity=".25"/>
  <text x="60" y="62" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="30" font-weight="900" fill="#b88cff">ПОБОЧНЫЕ ИЗМЕНЕНИЯ СОСТОЯНИЯ ЗА ОДИН TTI</text>
  <rect x="540" y="95" width="480" height="56" rx="14" fill="#101830" stroke="#7de3b2" stroke-opacity=".8">
    <animate attributeName="stroke-opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <text x="780" y="130" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="800" fill="#7de3b2">schedule(tti=5, users)</text>
  <path d="M700 151 V176 H290 V200" fill="none" stroke="#7de3b2" stroke-opacity=".6" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arr2)"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite"/></path><path d="M780 151 V200" fill="none" stroke="#4edcff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arr2)"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite"/></path><path d="M860 151 V176 H1270 V200" fill="none" stroke="#ffb347" stroke-opacity=".6" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arr2)"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite"/></path><path d="M540 123 H36 V670 H60" fill="none" stroke="#b88cff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arr2)"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite"/></path><path d="M1020 123 H1524 V670 H1500" fill="none" stroke="#9aa7c7" stroke-opacity=".6" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arr2)"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite"/></path>
  <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      <rect x="60" y="200" width="460" height="300" rx="16" fill="#101830" stroke="#7de3b2" stroke-opacity=".55"/>
      <text x="82" y="238" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#7de3b2">SCHEDULER.py — внутри</text>
      <text x="82" y="266" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">cqi_map: 3 записи CQIMap (живёт между TTI)</text><text x="82" y="297" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">_ue_queue: [1,2,3] и ротация (живёт)</text><text x="82" y="328" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">pdcch: num_assigned=2, allocations={3:1, 1:1}</text><text x="82" y="359" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">  (сбросится в reset_tti следующего TTI)</text><text x="82" y="390" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">~15 полей _last_* + last_ue_transmitted_bits</text><text x="82" y="421" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">у RR/FD_FGS: rr_rbg_offset, rr_ue_offset (живут)</text></g><g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
      <rect x="550" y="200" width="460" height="300" rx="16" fill="#101830" stroke="#4edcff" stroke-opacity=".55"/>
      <text x="572" y="238" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#4edcff">RES_GRID.py — сетка</text>
      <text x="572" y="266" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">RB 0–17 подкадра 5 заняты (оба слота)</text><text x="572" y="297" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">ALLOCATE_RBG → ASSIGN_RB на каждый RB</text><text x="572" y="328" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">grid.stats: allocated_rbs, by_user, by_tti</text><text x="572" y="359" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">занято до переиспользования подкадра</text><text x="572" y="390" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">(кадр из 10 подкадров)</text></g><g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
      <rect x="1040" y="200" width="460" height="300" rx="16" fill="#101830" stroke="#ffb347" stroke-opacity=".55"/>
      <text x="1062" y="238" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#ffb347">BS_MODULE.py — буфер</text>
      <text x="1062" y="266" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">get_packets(grants) физически изъял:</text><text x="1062" y="297" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">UE1: −1000 B (буфер пуст)</text><text x="1062" y="328" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">UE3: −300 B (буфер пуст)</text><text x="1062" y="359" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">UE2: без изменений (не запланирован)</text><text x="1062" y="390" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">пакеты = «переданы по воздуху»</text></g><g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.05s" fill="freeze"/>
      <rect x="60" y="540" width="700" height="260" rx="16" fill="#101830" stroke="#b88cff" stroke-opacity=".55"/>
      <text x="82" y="578" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#b88cff">UE_MODULE.py — объекты UE</text>
      <text x="82" y="606" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">current_dl_throughput: 8.004 / 0 / 2.404 Мбит/с</text><text x="82" y="637" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">average_throughput (EWMA α=0.002): 16008 / 0 / 4808 бит/с</text><text x="82" y="668" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">  → знаменатель PF-метрики в следующих TTI</text><text x="82" y="699" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">last_transmitted_bits, total_dl_transmitted_bits</text><text x="82" y="730" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">сброс current_dl_throughput=0 в начале каждого TTI (этап 1)</text></g><g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
      <rect x="790" y="540" width="710" height="260" rx="16" fill="#101830" stroke="#9aa7c7" stroke-opacity=".55"/>
      <text x="812" y="578" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#9aa7c7">users dict — только на время TTI</text>
      <text x="812" y="606" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">+ bs_buffer_size (этап 1) — сумма байт в буфере BS</text><text x="812" y="637" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">+ priority (этап 3) — контракт _calculate_priorities</text><text x="812" y="668" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">+ allocated_cce (этап 5) — у получивших PDCCH</text><text x="812" y="699" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">+ instant_rate (этап 3, только у PF-моделей)</text><text x="812" y="730" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#dbe4ff">список пересоздаётся каждый TTI → поля не переживают TTI</text></g>
</svg>