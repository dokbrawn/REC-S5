, 'DejaVu Sans', sans-serif" font-size="26" font-weight="800" fill="#dbe4ff">12</text><rect x="712" y="374" width="96" height="60" rx="10" fill="#1b2648" fill-opacity="0.55" stroke="#7de3b2" stroke-opacity="1" stroke-width="3"/><text x="760.0" y="414.0" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="800" fill="#7de3b2">11</text><text x="797.0" y="389.0" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" font-weight="800" fill="#7de3b2">✓</text><text x="604" y="484" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#7de3b2">оптимум (венгерский): 14+15+10+11 = 50</text><text x="604" y="514" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16.5" fill="#ffe066">жадный «каждому UE лучший RBG»: 15+15+7+11 = 48</text><text x="604" y="540" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#6c7aa0">UE1 забирает RBG1 → UE3 вытеснен на RBG2 (7 вместо 10)</text><rect x="40" y="140" width="290" height="400" rx="14" fill="#1b2648" fill-opacity="0.3" stroke="#b88cff" stroke-opacity="0.4"/><text x="62" y="176" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15.5" font-weight="900" fill="#b88cff">ЗАЧЕМ НАШЕМУ МОДУЛЮ</text><text x="62" y="206" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">роадмап SCHEDULER.py, п.6:</text><text x="62" y="229" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#6c7aa0">«Исследование механизма</text><text x="62" y="252" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#6c7aa0">распределения RBG, венгерский,</text><text x="62" y="275" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#6c7aa0">жадный и др.»</text><text x="62" y="321" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#4edcff">обе srsRAN жадные:</text><text x="62" y="344" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">4G — маска на UE, NR —</text><text x="62" y="367" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">итерации по RBG внутри</text><text x="62" y="390" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">слайса; оптимум локальный</text><text x="62" y="436" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#7de3b2">венгерский = глобальный</text><text x="62" y="459" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#7de3b2">оптимум назначения и</text><text x="62" y="482" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">верхняя граница для</text><text x="62" y="505" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">бенчмарка FD-аллокаторов</text><rect x="860" y="140" width="270" height="400" rx="14" fill="#1b2648" fill-opacity="0.3" stroke="#4edcff" stroke-opacity="0.4"/><text x="882" y="176" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" font-weight="900" fill="#4edcff">ШАГИ МЕТОДА</text><text x="882" y="206" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#ffb347">0 · стоимость = C_max − CQI</text><text x="882" y="229" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#6c7aa0">   (максимизацию → минимум)</text><text x="882" y="275" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">1 · вычесть минимум строки</text><text x="882" y="298" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">2 · вычесть минимум столбца</text><text x="882" y="321" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">3 · найти независимые нули</text><text x="882" y="344" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">4 · покрыть нули минимальным</text><text x="882" y="367" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">   числом линий</text><text x="882" y="390" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">5 · min непокрытого вычесть,</text><text x="882" y="413" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">   на пересечениях прибавить</text><text x="882" y="459" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#9aa7c7">повторять 3–5 до полного</text><text x="882" y="482" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#9aa7c7">назначения · O(N³)</text>
