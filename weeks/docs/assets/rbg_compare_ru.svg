<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="620" viewBox="0 0 1560 620">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c7aa0"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7de3b2"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff8cc8"/></marker>
  </defs>
  <rect width="1560" height="620" rx="18" fill="#0d1222"/>
  <rect width="1560" height="620" rx="18" fill="none" stroke="#7de3b2" stroke-opacity=".22"/>
  <text x="50" y="52" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="900" fill="#7de3b2">АЛЛОКАТОРЫ ДАННЫХ: RBG И PRB</text>
  <text x="50" y="80" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15.5" fill="#9aa7c7">одна и та же задача — отдать частотный ресурс гранту — решается тремя разными структурами</text>
  <rect x="50" y="100" width="470" height="460" rx="16" fill="#1b2648" fill-opacity="0.3" stroke="#7de3b2" stroke-opacity="0.35"/><text x="285.0" y="136" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="900" fill="#7de3b2">НАША МОДЕЛЬ</text><rect x="92.0" y="160" width="28.5" height="52" rx="7" fill="#7de3b2" fill-opacity="0.85" stroke="#7de3b2" stroke-opacity="0.5"/><rect x="124.5" y="160" width="28.5" height="52" rx="7" fill="#7de3b2" fill-opacity="0.85" stroke="#7de3b2" stroke-opacity="0.5"/><rect x="157.0" y="160" width="28.5" height="52" rx="7" fill="#7de3b2" fill-opacity="0.85" stroke="#7de3b2" stroke-opacity="0.5"/><rect x="189.5" y="160" width="28.5" height="52" rx="7" fill="#4edcff" fill-opacity="0.85" stroke="#4edcff" stroke-opacity="0.5"/><rect x="222.0" y="160" width="28.5" height="52" rx="7" fill="#4edcff" fill-opacity="0.85" stroke="#4edcff" stroke-opacity="0.5"/><rect x="254.5" y="160" width="28.5" height="52" rx="7" fill="#4edcff" fill-opacity="0.85" stroke="#4edcff" stroke-opacity="0.5"/><rect x="287.0" y="160" width="28.5" height="52" rx="7" fill="#4edcff" fill-opacity="0.85" stroke="#4edcff" stroke-opacity="0.5"/><rect x="319.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="352.0" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="384.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="417.0" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="449.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><text x="285.0" y="238" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#6c7aa0">занято последовательно: 0,1,2 → UE1, 3..6 → UE2</text><text x="74" y="270" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• ALLOCATE_RBG(tti, rbg, ue) :430</text><text x="74" y="296" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• перебор RB обоих слотов подкадра</text><text x="74" y="322" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• ALLOCATE_RB на каждый RB</text><text x="74" y="348" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• частичный провал → RELEASE_RBG :437</text><text x="74" y="388" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">RBG выдаются планировщиком по порядку, занятость</text><text x="74" y="408" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">видна в сетке RES_GRID; внутри ALLOCATE_RBG есть</text><text x="74" y="428" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">настоящий откат.</text><rect x="550" y="100" width="470" height="460" rx="16" fill="#1b2648" fill-opacity="0.3" stroke="#4edcff" stroke-opacity="0.35"/><text x="785.0" y="136" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="900" fill="#4edcff">srsRAN 4G</text><rect x="592.0" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="624.5" y="160" width="28.5" height="52" rx="7" fill="#4edcff" fill-opacity="0.85" stroke="#4edcff" stroke-opacity="0.5"/><rect x="657.0" y="160" width="28.5" height="52" rx="7" fill="#4edcff" fill-opacity="0.85" stroke="#4edcff" stroke-opacity="0.5"/><rect x="689.5" y="160" width="28.5" height="52" rx="7" fill="#4edcff" fill-opacity="0.85" stroke="#4edcff" stroke-opacity="0.5"/><rect x="722.0" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="754.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="787.0" y="160" width="28.5" height="52" rx="7" fill="#ffb347" fill-opacity="0.85" stroke="#ffb347" stroke-opacity="0.5"/><rect x="819.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="852.0" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="884.5" y="160" width="28.5" height="52" rx="7" fill="#ffb347" fill-opacity="0.85" stroke="#ffb347" stroke-opacity="0.5"/><rect x="917.0" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="949.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><text x="785.0" y="238" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#6c7aa0">маска: свободны «дыры» — 0,4,5,7,8,10,11</text><text x="574" y="270" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• rbgmask_t — битовая маска RBG подкадра</text><text x="574" y="296" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• alloc_dl :134: поиск свободной маски</text><text x="574" y="322" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• коллизия → отказ, маска не меняется</text><text x="574" y="348" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• commit: dl_mask |= alloc_mask :162</text><text x="574" y="388" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">Маска подкадра хранится в sched_grid; коллизии</text><text x="574" y="408" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">исключены проверкой до commit; rem_last_alloc_dl :235</text><text x="574" y="428" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">— редкий откат для SIB.</text><rect x="1050" y="100" width="470" height="460" rx="16" fill="#1b2648" fill-opacity="0.3" stroke="#b88cff" stroke-opacity="0.35"/><text x="1285.0" y="136" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="900" fill="#b88cff">srsRAN PROJECT</text><rect x="1092.0" y="160" width="28.5" height="52" rx="7" fill="#b88cff" fill-opacity="0.85" stroke="#b88cff" stroke-opacity="0.5"/><rect x="1124.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="1157.0" y="160" width="28.5" height="52" rx="7" fill="#ff8cc8" fill-opacity="0.85" stroke="#ff8cc8" stroke-opacity="0.5"/><rect x="1189.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="1222.0" y="160" width="28.5" height="52" rx="7" fill="#b88cff" fill-opacity="0.85" stroke="#b88cff" stroke-opacity="0.5"/><rect x="1254.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="1287.0" y="160" width="28.5" height="52" rx="7" fill="#ff8cc8" fill-opacity="0.85" stroke="#ff8cc8" stroke-opacity="0.5"/><rect x="1319.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="1352.0" y="160" width="28.5" height="52" rx="7" fill="#b88cff" fill-opacity="0.85" stroke="#b88cff" stroke-opacity="0.5"/><rect x="1384.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><rect x="1417.0" y="160" width="28.5" height="52" rx="7" fill="#ff8cc8" fill-opacity="0.85" stroke="#ff8cc8" stroke-opacity="0.5"/><rect x="1449.5" y="160" width="28.5" height="52" rx="7" fill="#2a3658" fill-opacity="0" stroke="#2a3658" stroke-opacity="0.5"/><text x="1285.0" y="238" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#6c7aa0">interleaved: VRB одного UE разнесены по полосе</text><text x="1074" y="270" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• resource_grid: PRB-битмап слота</text><text x="1074" y="296" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• VRB → CRB: localized и interleaved</text><text x="1074" y="322" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• recommended_vrbs на каждый грант :537</text><text x="1074" y="348" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• провал → отмена PDCCH и гранта :255</text><text x="1074" y="388" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">Аллокация идёт виртуальными RB с отображением в</text><text x="1074" y="408" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">физические — частотная разнесённость заложена в саму</text><text x="1074" y="428" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">сетку.</text>
  <text x="50" y="604" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#6c7aa0">Ключевое отличие нашей модели: нет битовой маски подкадра и частотного разнесения — но есть честный посимвольный учёт RB и откат внутри ALLOCATE_RBG.</text>
</svg>