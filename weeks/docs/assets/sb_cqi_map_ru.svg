<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640">
  <rect width="1160" height="640" rx="18" fill="#0d1222"/>
  <rect width="1160" height="640" rx="18" fill="none" stroke="#4edcff" stroke-opacity=".22"/>
  <text x="50" y="52" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="900" fill="#4edcff">SUBBAND CQI → RBG: ДВА МЕХАНИЗМА ЧАСТОТНОГО ВЫБОРА</text>
  <text x="50" y="80" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15.5" fill="#9aa7c7">4G: маска на одного UE сжимается от худшего CQI с пересчётом TBS · у нас: UE торгуются за каждый RBG по порядку</text>
  <rect x="40" y="100" width="530" height="500" rx="16" fill="#1b2648" fill-opacity="0.3" stroke="#7de3b2" stroke-opacity="0.35"/><text x="64" y="136" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="900" fill="#7de3b2">srsRAN 4G · sched_dl_cqi</text><text x="64" y="164" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#9aa7c7">K саббандов на N RBG — соответствие не 1:1</text><rect x="64" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#4edcff" stroke-opacity="0.8"/><text x="85" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#4edcff">R0</text><rect x="113" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#4edcff" stroke-opacity="0.8"/><text x="134" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#4edcff">R1</text><rect x="162" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#4edcff" stroke-opacity="0.8"/><text x="183" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#4edcff">R2</text><rect x="211" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#b88cff" stroke-opacity="0.8"/><text x="232" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#b88cff">R3</text><rect x="260" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#b88cff" stroke-opacity="0.8"/><text x="281" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#b88cff">R4</text><rect x="309" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#b88cff" stroke-opacity="0.8"/><text x="330" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#b88cff">R5</text><rect x="358" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#b88cff" stroke-opacity="0.8"/><text x="379" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#b88cff">R6</text><rect x="407" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#ffb347" stroke-opacity="0.8"/><text x="428" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#ffb347">R7</text><rect x="456" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#ffb347" stroke-opacity="0.8"/><text x="477" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#ffb347">R8</text><rect x="505" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#ffb347" stroke-opacity="0.8"/><text x="526" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#ffb347">R9</text><text x="134" y="240" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#4edcff">SB0 · CQI 12</text><text x="281" y="240" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#b88cff">SB1 · CQI 6</text><text x="477" y="240" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#ffb347">SB2 · CQI 14</text><text x="64" y="274" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• rbg_to_sb_index(rbg) = rbg · N / cell_nof_rbg</text><text x="64" y="300" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• несколько RBG делят одно значение CQI</text><text x="64" y="326" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• K = 0 (RRC) → subband выключен, только wb_cqi_avg</text><text x="64" y="352" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#ffe066">• нет свежего фидбэка → fallback на wideband</text><line x1="64" y1="374" x2="546" y2="374" stroke="#2a3658"/><text x="64" y="404" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#7de3b2">цикл сжатия маски (find_optimal_rbgmask)</text><circle cx="76" cy="429" r="11" fill="#0d1222" stroke="#7de3b2"/><text x="76" y="434" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="800" fill="#7de3b2">1</text><text x="96" y="434" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">полная свободная маска (с учётом DCI 1A)</text><circle cx="76" cy="459" r="11" fill="#0d1222" stroke="#7de3b2"/><text x="76" y="464" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="800" fill="#7de3b2">2</text><text x="96" y="464" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">remove_min_cqi_rbgs — выкинуть RBG с min CQI</text><circle cx="76" cy="489" r="11" fill="#0d1222" stroke="#7de3b2"/><text x="76" y="494" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="800" fill="#7de3b2">3</text><text x="96" y="494" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">пересчитать MCS/TBS по уменьшенной маске</text><circle cx="76" cy="519" r="11" fill="#0d1222" stroke="#7de3b2"/><text x="76" y="524" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="800" fill="#7de3b2">4</text><text x="96" y="524" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">TBS ≥ запрошено и не ухудшился → принять, иначе стоп</text><text x="64" y="570" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-style="italic" fill="#6c7aa0">комментарий в самом коде: «no guarantee this is going</text><text x="64" y="588" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" font-style="italic" fill="#6c7aa0">to be the optimal solution» + «TODO: can be optimized»</text><rect x="590" y="100" width="530" height="500" rx="16" fill="#1b2648" fill-opacity="0.3" stroke="#b88cff" stroke-opacity="0.35"/><text x="614" y="136" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="21" font-weight="900" fill="#b88cff">наш модуль · CQIMap.sb_cqi</text><text x="614" y="164" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#9aa7c7">список длиной num_rbg — значение на каждый RBG</text><rect x="614" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#7de3b2" stroke-opacity="1"/><text x="635" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#7de3b2">12</text><rect x="663" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#2a3658" stroke-opacity="0.8"/><text x="684" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#9aa7c7">11</text><rect x="712" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#2a3658" stroke-opacity="0.8"/><text x="733" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#9aa7c7">10</text><rect x="761" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#2a3658" stroke-opacity="0.8"/><text x="782" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#9aa7c7">6</text><rect x="810" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#2a3658" stroke-opacity="0.8"/><text x="831" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#9aa7c7">6</text><rect x="859" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#2a3658" stroke-opacity="0.8"/><text x="880" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#9aa7c7">7</text><rect x="908" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#7de3b2" stroke-opacity="1"/><text x="929" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#7de3b2">14</text><rect x="957" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#7de3b2" stroke-opacity="1"/><text x="978" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#7de3b2">13</text><rect x="1006" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#7de3b2" stroke-opacity="1"/><text x="1027" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#7de3b2">12</text><rect x="1055" y="182" width="43" height="34" rx="6" fill="#0d1222" stroke="#2a3658" stroke-opacity="0.8"/><text x="1076" y="204" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#9aa7c7">8</text><text x="614" y="248" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• гранулярность мельче, чем саббанды 4G</text><text x="614" y="274" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#dbe4ff">• sb_cqi_list[rbg_idx] идёт прямо в FD-метрику</text><text x="614" y="300" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#ffe066">• пусто/ноль → fallback _get_wb_cqi(ue)</text><line x1="614" y1="322" x2="1096" y2="322" stroke="#2a3658"/><text x="614" y="352" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#b88cff">другая форма выбора: не маска, а торги за RBG</text><text x="614" y="384" font-family="ui-monospace, monospace" font-size="14.5" fill="#b88cff">for rbg_idx in range(total_rbg):</text><text x="614" y="411" font-family="ui-monospace, monospace" font-size="14.5" fill="#dbe4ff">    cqi = sb_cqi[rbg_idx]  или  wb_cqi</text><text x="614" y="438" font-family="ui-monospace, monospace" font-size="14.5" fill="#dbe4ff">    metric = PF(cqi → bits, tput_avg, buf)</text><text x="614" y="465" font-family="ui-monospace, monospace" font-size="14.5" fill="#dbe4ff">    winner = argmax(metric) по UE с буфером</text><text x="614" y="492" font-family="ui-monospace, monospace" font-size="14.5" fill="#7de3b2">    ALLOCATE_RBG(winner, rbg_idx)  # коммит</text><text x="614" y="540" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#6c7aa0">плюс: rbg_width = len(GET_RBG_INDICES(i)) —</text><text x="614" y="560" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#6c7aa0">последний узкий RBG учитывается честно</text>
</svg>