<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="560" viewBox="0 0 1560 560">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c7aa0"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7de3b2"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff8cc8"/></marker>
  </defs>
  <rect width="1560" height="560" rx="18" fill="#0d1222"/>
  <rect width="1560" height="560" rx="18" fill="none" stroke="#b88cff" stroke-opacity=".22"/>
  <text x="50" y="52" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" font-weight="900" fill="#b88cff">МЕТРИКА PROPORTIONAL FAIR: ТРИ РЕАЛИЗАЦИИ</text>
  <text x="50" y="80" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15.5" fill="#9aa7c7">одна идея r/R — и три разных уровня развития: чистая метрика, настраиваемая метрика, метрика внутри QoS-веса</text>
  <rect x="50" y="100" width="470" height="390" rx="16" fill="#1b2648" fill-opacity="0.3" stroke="#7de3b2" stroke-opacity="0.35"/><text x="285.0" y="136" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="900" fill="#7de3b2">НАША МОДЕЛЬ</text><text x="285.0" y="160" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#6c7aa0">SCHEDULER.py :2073–2112</text><text x="74" y="196" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• pf_metric = instant_rate / avg_throughput_per_tti</text><text x="74" y="224" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• instant_rate = rb_per_slot · GET_BITS_PER_RB(cqi)</text><text x="88" y="243" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">:2100</text><text x="74" y="271" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• avg ≤ 0 → защита 1e-6, метрика = instant/1.0 :2107</text><text x="74" y="299" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• история — average_throughput из UE_MODULE (EWMA)</text><text x="74" y="339" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">Знаменатель обновляет соседний модуль; коэффициент</text><text x="74" y="359" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">справедливости отсутствует (жёстко = 1).</text><rect x="550" y="100" width="470" height="390" rx="16" fill="#1b2648" fill-opacity="0.3" stroke="#4edcff" stroke-opacity="0.35"/><text x="785.0" y="136" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="900" fill="#4edcff">srsRAN 4G</text><text x="785.0" y="160" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#6c7aa0">schedulers/sched_time_pf.cc</text><text x="574" y="196" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• dl_prio = r / R^fairness_coeff :200</text><text x="574" y="224" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• r = get_expected_dl_bitrate/8 :193 — оценка, не</text><text x="588" y="243" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">факт</text><text x="574" y="271" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• R — EWMA: fast-start арифметическим средним</text><text x="588" y="290" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">:217–219</text><text x="574" y="318" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• fairness_coeff — параметр конфига :33</text><text x="574" y="358" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">Пока мало наблюдений, среднее считается честно; позже</text><text x="574" y="378" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">— экспоненциальное сглаживание с настраиваемой</text><text x="574" y="398" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">жёсткостью.</text><rect x="1050" y="100" width="470" height="390" rx="16" fill="#1b2648" fill-opacity="0.3" stroke="#b88cff" stroke-opacity="0.35"/><text x="1285.0" y="136" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="900" fill="#b88cff">srsRAN PROJECT</text><text x="1285.0" y="160" text-anchor="middle" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#6c7aa0">policy/scheduler_time_qos.cpp</text><text x="1074" y="196" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• prio = pf_weight · gbr · delay · prio_weight</text><text x="1088" y="215" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">:190–198</text><text x="1074" y="243" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• compute_pf_metric(estim, avg, coeff) :106</text><text x="1074" y="271" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• 5QI + ARP: max_combined_prio_level :155</text><text x="1074" y="299" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#dbe4ff">• time-RR — альтернативная политика :34</text><text x="1074" y="339" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">PF — лишь один из множителей: QoS-приоритеты, GBR и</text><text x="1074" y="359" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#9aa7c7">бюджет задержки домножаются на метрику.</text>
  <text x="50" y="544" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14.5" fill="#6c7aa0">Во всех трёх числитель — оценка мгновенной скорости из CQI; различия — в знаменателе, сглаживании и надстройках.</text>
</svg>