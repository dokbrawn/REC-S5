u Sans" font-size="26px" font-weight="600" text-anchor="middle">SchedulingGrant</text><text x="352.5" y="398" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">UE • bytes • LCID • HARQ • RV</text><rect x="580" y="325" width="285" height="105" rx="18" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="722.5" y="367" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">Обработка буфера</text><text x="722.5" y="398" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">_process_buffers()</text><rect x="950" y="325" width="200" height="105" rx="18" fill="#151c31" stroke="#7de3b2" stroke-width="2"/><text x="1050.0" y="367" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">Статистика</text><text x="1050.0" y="398" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">DL throughput / bits</text><line x1="1045" y1="200" x2="350" y2="325" stroke="#e6ecff" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 5"/><line x1="495" y1="378" x2="580" y2="378" stroke="#4edcff" stroke-width="3" marker-end="url(#arrow)"/><line x1="865" y1="378" x2="950" y2="378" stroke="#4edcff" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="515" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="start">SchedulingGrant содержит LCID и HARQ; единый объект ещё не проходит через весь pipeline.</text></svg>