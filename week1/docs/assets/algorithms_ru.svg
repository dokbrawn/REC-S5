<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a3658" stroke-width="1" opacity="0.22"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4edcff"/></marker></defs>
<rect width="1200" height="650" fill="#0d1222"/>
<rect width="1200" height="650" fill="url(#grid)"/>

<rect x="70" y="110" width="430" height="105" rx="18" fill="#151c31" stroke="#4edcff" stroke-width="2"/><text x="285.0" y="152" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">Round Robin</text><text x="285.0" y="183" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">стартовая позиция очереди</text><rect x="70" y="245" width="430" height="105" rx="18" fill="#151c31" stroke="#7de3b2" stroke-width="2"/><text x="285.0" y="287" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">Best CQI</text><text x="285.0" y="318" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">WB CQI</text><rect x="70" y="380" width="430" height="105" rx="18" fill="#151c31" stroke="#b88cff" stroke-width="2"/><text x="285.0" y="422" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">Proportional Fair</text><text x="285.0" y="453" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">скорость / история</text><rect x="610" y="110" width="430" height="105" rx="18" fill="#151c31" stroke="#7de3b2" stroke-width="2"/><text x="825.0" y="152" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">FD Best CQI</text><text x="825.0" y="183" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">SB CQI на каждом RBG</text><rect x="610" y="245" width="430" height="105" rx="18" fill="#151c31" stroke="#ffb86b" stroke-width="2"/><text x="825.0" y="287" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">FD Fair Greedy</text><text x="825.0" y="318" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">SB CQI + served set</text><rect x="610" y="380" width="430" height="105" rx="18" fill="#151c31" stroke="#b88cff" stroke-width="2"/><text x="825.0" y="422" fill="#e6ecff" font-family="DejaVu Sans" font-size="26px" font-weight="600" text-anchor="middle">FD Proportional Fair</text><text x="825.0" y="453" fill="#9aa9c8" font-family="DejaVu Sans" font-size="18px" font-weight="400" text-anchor="middle">SB CQI + throughput</text><text x="540" y="80" fill="#4edcff" font-family="DejaVu Sans" font-size="20px" font-weight="700" text-anchor="middle">TD</text><text x="1080" y="80" fill="#b88cff" font-family="DejaVu Sans" font-size="20px" font-weight="700" text-anchor="middle">FD</text><text x="70" y="555" fill="#9aa9c8" font-family="DejaVu Sans" font-size="20px" font-weight="400" text-anchor="start">TD формирует общий порядок на TTI, FD дополнительно пересчитывает выбор внутри каждого RBG.</text></svg>