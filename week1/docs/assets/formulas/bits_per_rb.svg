<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
  <defs>
    <linearGradient id="fsheenbits_per_rb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4edcff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4edcff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4edcff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fclipbits_per_rb"><rect width="1000" height="250" rx="16"/></clipPath>
    <style><![CDATA[
      .fswbits_per_rb{animation:fswpbits_per_rb 6s linear infinite}
      @keyframes fswpbits_per_rb{from{transform:translateX(-320px)}to{transform:translateX(1000px)}}
    ]]></style>
  </defs>
  <rect width="1000" height="250" rx="16" fill="#0d1222"/>
  <g clip-path="url(#fclipbits_per_rb)"><rect class="fswbits_per_rb" x="0" y="0" width="300" height="250" fill="url(#fsheenbits_per_rb)"/></g>
  <rect x="0" y="14" width="6" height="222" rx="3" fill="#4edcff" opacity=".75">
    <animate attributeName="opacity" values=".4;.9;.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="250" rx="16" fill="none" stroke="#4edcff" stroke-opacity=".35"/>
  <text x="44" y="42" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#6c7aa0">ЁМКОСТЬ RB · AMC.GET_BITS_PER_RB :1700</text>
  <text x="44" y="80" font-family="'Cambria Math', Georgia, serif" font-size="24" fill="#e8eeff">RE = [(7 − PCFICH) · 12 − 4·n<tspan baseline-shift="sub" font-size="18">ports</tspan>] + [7 · 12 − 4·n<tspan baseline-shift="sub" font-size="18">ports</tspan>]</text><text x="44" y="128" font-family="'Cambria Math', Georgia, serif" font-size="24" fill="#e8eeff">bits/RB = ⌊RE · Q<tspan baseline-shift="sub" font-size="18">m</tspan> · R⌋     (10 МГц, PCFICH=2: RE = 136)</text><text x="44" y="176" font-family="'Cambria Math', Georgia, serif" font-size="24" fill="#e8eeff">CQI 15 → 798 бит/RB · CQI 13 → 755 · CQI 7 → 326</text>
</svg>