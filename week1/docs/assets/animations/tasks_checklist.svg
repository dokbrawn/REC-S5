      <text x="100" y="116" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="600" fill="#dbe4ff">Проследить полный scheduling cycle по коду: данные UE → выбор → распределение ресурсов → буферы и статистика</text>
    </g><g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
      <rect x="44" y="163" width="34" height="34" rx="9" fill="#101830" stroke="#7de3b2" stroke-opacity=".6"/>
      <path d="M52 181 l7 8 l13 -16" fill="none" stroke="#7de3b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
