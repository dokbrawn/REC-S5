        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="0.6s" begin="0.9s" fill="freeze"/></path>
      <text x="100" y="190" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" font-weight="600" fill="#dbe4ff">Схема вызовов для одного небольшого сценария (3 UE, BestCQI, 10 МГц, TTI 5)</text>
    </g><g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
      <rect x="44" y="237" width="34" height="34" rx="9" fill="#101830" stroke="#7de3b2" stroke-opacity=".6"/>
      <path d="M52 255 l7 8 l13 -16" fill="none" stroke="#7de3b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
