<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a3658" stroke-width="1" opacity=".26"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="9s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="bgGlow" cx="80%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#1b2648"/>
      <stop offset="55%" stop-color="#0d1222"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </radialGradient>
    <linearGradient id="titleGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#4edcff"/>
      <stop offset=".6" stop-color="#d9d0ff"/>
      <stop offset="1" stop-color="#b88cff"/>
    </linearGradient>
    <linearGradient id="fadeMask" x1="0" x2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="rightFade">
      <rect x="1080" y="0" width="520" height="420" fill="url(#fadeMask)"/>
    </mask>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .heroTitle{animation:titleIn 2.0s ease-out both}
      .heroText{animation:fade 1.2s ease-out .4s both}
      .heroBadge{animation:fade .9s ease-out .05s both}
      @keyframes titleIn{from{opacity:0;transform:translateY(16px);letter-spacing:18px}to{opacity:1;transform:translateY(0);letter-spacing:4px}}
      @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    ]]></style>
  </defs>

  <rect width="1600" height="420" fill="url(#bgGlow)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <!-- radar rings, top right -->
  <g>
    <circle cx="1370" cy="-10" r="270" fill="none" stroke="#4edcff" stroke-width="1.4" opacity=".14"/>
    <circle cx="1370" cy="-10" r="195" fill="none" stroke="#b88cff" stroke-width="1.4" opacity=".12"/>
    <circle cx="1370" cy="-10" r="120" fill="none" stroke="#7de3b2" stroke-width="1.2" opacity=".10"/>
    <g style="transform-origin:1370px -10px" filter="url(#softGlow)">
      <path d="M1370 -10 L1370 -280" stroke="#4edcff" stroke-width="2" opacity=".55" stroke-linecap="round"/>
      <path d="M1370 -10 L1370 -280" stroke="#4edcff" stroke-width="20" opacity=".08" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1370 -10" to="360 1370 -10" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

